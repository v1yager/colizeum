[project]
name = "colizeum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krypt1n", email = "krypt1n@proton.me" }
]
requires-python = ">=3.15"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "prettytable>=3.18.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
colizeum = "colizeum:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # Automatically handle async tests
asyncio_default_fixture_loop_scope = "function"  # New in 0.23+
