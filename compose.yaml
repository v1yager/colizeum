services:
  bot:
    build: .
    container_name: colizeum-bot
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      seed:
        condition: service_completed_successfully

  migrate:
    build: .
    container_name: colizeum-migrate
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:17-alpine
    container_name: colizeum-seed
    restart: "no"

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./sql_templates/award_types.sql:/seed.sql:ro

    command:
      - psql
      - -h
      - db
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed.sql

    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    container_name: colizeum-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
